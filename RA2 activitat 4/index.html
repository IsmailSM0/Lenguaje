<html lang="ca">

    <link rel="icon" type="image/x-icon" href="../Imatges/favicon.ico.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">

  <header> 
    <a href="index.html">

    <nav>
        <ul>
            <li><a href="buscador.html">Buscador</a></li>
            <li><a href="contacte.html">Contacte</a></li>
        </ul>
    </nav>
  </header>
    <main>
        <section class="buscador">
        <h1>BUSCAR una pel·lícula</h1>
        <p>Milions de títols, un sol cercador.</p>
         <form method="get" action="https://www.themoviedb.org/search">
           <div>
             <label for="cerca" class="sr-only">Cerca una pel·lícula:</label>
             <input type="search" id="cerca" name="query" placeholder="Cerca una pel·lícula, per exemple <<Dune>>..." required>
             <button type="submit">Cercar</button>
          </div>
         </form>
        </section>
        <section class="pelicules">
            <h2>Resultats</h2>
            <div class="resultats">
            <article class="targeta">
                <img src="../Imatges/Harry potter i la pedra filosofal.jpg" alt="Pòster Harry Potter i la pedra filosofal">
                <h3>Harry Potter i la pedra filosofal</h3>
                <p>2001</p>
            </article>   
            <article class="targeta">
                <img src="../Imatges/Harry potter y la cambra.jpg" alt="Pòster Harry Potter i la cambra secreta">
                <h3>Harry Potter i la cambra secreta</h3>
                <p>2002</p>
            </article>
            <article class="targeta">
                <img src="../Imatges/Harry potter i l'ordre.jpg" alt="Pòster Harry Potter i l'orde del fènix">
                <h3>Harry Potter i l'orde del fènix</h3>
                <p>2007</p>
            </article>
            </div>
        </section>
    </main>
